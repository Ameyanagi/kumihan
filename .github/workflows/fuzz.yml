name: Extended parser fuzzing

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Extended deterministic campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.76.2
          cache: true
      - run: pixi run --locked fuzz-long
      - name: Retain failing input and reproduction metadata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fuzz-failures
          path: .pixi/fuzz-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
